    provider: claude
    family: anthropic
    model: haiku
    tier: fast
    enabled: true
    local: false
    roles: { architect: 0, implementer: 0, debugger: 0, reviewer: 6, researcher: 8, test: 5, log-analysis: 7 }
    efforts: [low, medium, high]
    default_effort: low
    capabilities: { tools: true, vision: false, huge_context: false, write_safe: true }
    limits: { context_tokens: 200000 }
    cost: { input_per_million: 0, output_per_million: 0 }
