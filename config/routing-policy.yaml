version: 1
phase: 2
defaults:
  readOnly: true
  # Total worker runtime: startup, queueing, tool use, and final output.
  # Implementation workers can legitimately take far longer than a simple reply.
  # Health checks remain short and independent of this limit.
  timeoutMs: 3600000
rules:
  automaticSelection: true
  requireExplicitFallback: true
  requireIndependentFamiliesForHighDiversity: true
effort:
  complexity: { trivial: low, normal: medium, difficult: high, extreme: xhigh }
  minimumForRisk: { low: low, medium: medium, high: high }
diversity:
  none: { minimumFamilies: 1 }
  low: { minimumFamilies: 1 }
  medium: { minimumFamilies: 2 }
  high: { minimumFamilies: 2, requireIndependentReview: true }
prompt:
  # Conservative character-based estimate; DTR never reads host instruction files.
  charsPerToken: 4
  # Normal `dtr route` packets are capped at 100 words. This leaves a small,
  # explicit allowance for DTR's return contract and provider-specific rules.
  maxInputTokens: 600
  responseReserveTokens: 384
  # Reserve known host-injected context here when it materially affects a model.
  hostContextReserveTokens: {}
  # Optional, bounded provider-specific task instructions. Keep empty by default.
  providers: {}
budget:
  mode: ignore
  max_estimated_cost_usd: 0.50
